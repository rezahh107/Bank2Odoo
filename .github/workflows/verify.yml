name: Bank2Odoo headless + Persian Qt verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact PR Head or push commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD) {
            throw "CI checkout mismatch: expected $env:EXPECTED_HEAD, got $actual"
          }
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
      - name: Install Python
        run: uv python install 3.13
      - name: Sync exact locked environment
        run: uv sync --locked
      - name: Run automated verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Temporary native Windows UI capture for visual review
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
        run: |
          @'
          import base64
          from PySide6.QtWidgets import QApplication
          from PySide6.QtCore import QBuffer, QIODevice
          from PySide6.QtGui import QFont, QFontDatabase, QFontInfo, QFontMetrics
          from bank2odoo.ui.window import MainWindow
          app = QApplication([])
          names = QFontDatabase.families()
          chosen = "Vazirmatn" if "Vazirmatn" in names else "Tahoma"
          app.setFont(QFont(chosen, 10))
          font = app.font()
          print("FONTPROBE:selected=" + chosen + ";actual=" + QFontInfo(font).family()
                + ";persian=" + str(QFontMetrics(font).inFontUcs4(ord("س")))
                + ";latin=" + str(QFontMetrics(font).inFontUcs4(ord("A"))))
          win = MainWindow()
          win.resize(850, 850)
          win.show()
          app.processEvents()
          buffer = QBuffer()
          buffer.open(QIODevice.OpenModeFlag.WriteOnly)
          assert win.grab().save(buffer, "PNG")
          data = base64.b64encode(bytes(buffer.data())).decode("ascii")
          for i in range(0, len(data), 4000):
              print("UICAPTURE_PART:" + data[i:i+4000])
          win.close()
          '@ | Set-Content -Path ui_capture.py -Encoding utf8
          uv run --locked python ui_capture.py
      - name: Smoke-run preserved headless entrypoint
        run: uv run --locked python -m bank2odoo
      - name: Check GUI module import
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked python -c "from bank2odoo.ui.window import MainWindow; print('Qt module import OK')"
