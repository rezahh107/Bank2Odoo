name: Bank2Odoo headless + Persian Qt verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact PR Head or push commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD) {
            throw "CI checkout mismatch: expected $env:EXPECTED_HEAD, got $actual"
          }
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
      - name: Install Python
        run: uv python install 3.13
      - name: Sync exact locked environment
        run: uv sync --locked
      - name: Run automated verification
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"  # Retain native/Python fatal diagnostics in Actions logs.
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Smoke-run preserved headless entrypoint
        run: uv run --locked python -m bank2odoo
      - name: Probe native Windows Qt style and real Windows QPA widget construction
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          @'
          from PySide6.QtWidgets import QApplication, QStyleFactory
          from bank2odoo.ui.window import MainWindow, configure_application, preferred_style_key
          app = QApplication([])
          keys = QStyleFactory.keys()
          print("Windows available QStyles:", keys)
          expected = preferred_style_key(keys, windows=True)
          configure_application(app)
          print("Selected Qt style:", app.style().objectName(), "preferred:", expected)
          if expected is not None:
              assert app.style().objectName().casefold() == expected.casefold()
          w = MainWindow()
          w.show()
          app.processEvents()
          assert w.approved.minimumHeight() >= 48
          assert not w.approved.isChecked()
          assert not w.styleSheet()
          w.close()
          print("Windows QPA widget creation OK (not a human visual review)")
          '@ | uv run --locked python -
      - name: Capture before/after Windows QPA diagnostic images (blank synthetic UI)
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 2ef2db1726ecf460eab231c4f5ac4a30413348ce
          git fetch --no-tags --depth=1 origin c4c5fdb28ab07a3389b1e395a59ed27e456d7da7
          @'
          import importlib.util
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          from PySide6.QtCore import Qt
          from PySide6.QtGui import QFont, QFontDatabase
          from PySide6.QtWidgets import QApplication
          from bank2odoo.ui.window import MainWindow, configure_application

          output = Path(os.environ["RUNNER_TEMP"]) / "bank2odoo-visual"
          output.mkdir(parents=True, exist_ok=True)
          app = QApplication([])
          app.setLayoutDirection(Qt.LayoutDirection.RightToLeft)

          def capture(window, prefix):
              window.show()
              app.processEvents()
              scroll = window.centralWidget()
              for position, value in (("top", 0), ("bottom", scroll.verticalScrollBar().maximum())):
                  scroll.verticalScrollBar().setValue(value)
                  app.processEvents()
                  pixmap = window.grab()
                  assert pixmap.width() >= 500 and pixmap.height() >= 450
                  assert pixmap.save(str(output / f"{prefix}-{position}.png"))
              window.close()
              app.processEvents()

          # Original main implementation: run in its original default Qt style,
          # 10 pt Vazirmatn/Tahoma font, and original global QSS.
          family = "Vazirmatn" if "Vazirmatn" in QFontDatabase.families() else "Tahoma"
          app.setFont(QFont(family, 10))
          source = subprocess.check_output([
              "git", "show",
              "2ef2db1726ecf460eab231c4f5ac4a30413348ce:bank2odoo/ui/window.py",
          ])
          with tempfile.TemporaryDirectory() as tmp:
              file = Path(tmp) / "baseline_window.py"
              file.write_bytes(source)
              spec = importlib.util.spec_from_file_location("baseline_window", file)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              capture(module.MainWindow(), "before")
          configure_application(app)
          capture(MainWindow(), "after")

          # Real Windows QPA palette diagnostics (no real bank statements).
          palette_spec = importlib.util.spec_from_file_location(
              "palette_diagnostics", Path("tests/test_gui_palette.py")
          )
          palette_module = importlib.util.module_from_spec(palette_spec)
          palette_spec.loader.exec_module(palette_module)
          for name, is_dark in (("light", False), ("dark", True)):
              app.setPalette(palette_module.synthetic_palette(dark=is_dark))
              app.processEvents()
              if is_dark:
                  # Inspect the exact original PRI-FND-001 starting Head, not
                  # the older pre-modernization main window.
                  bad_source = subprocess.check_output([
                      "git", "show",
                      "c4c5fdb28ab07a3389b1e395a59ed27e456d7da7:bank2odoo/ui/window.py",
                  ])
                  with tempfile.TemporaryDirectory() as tmp:
                      original_file = Path(tmp) / "defect_window.py"
                      original_file.write_bytes(bad_source)
                      previous_spec = importlib.util.spec_from_file_location(
                          "defect_window", original_file
                      )
                      previous_module = importlib.util.module_from_spec(previous_spec)
                      previous_spec.loader.exec_module(previous_module)
                      capture(previous_module.MainWindow(), "defect-dark")
              capture(MainWindow(), f"fixed-{name}")

          (output / "EVIDENCE_LIMITS.txt").write_text(
              "Windows hosted runner, Qt QPA=windows, blank synthetic UI.\n"
              "fixed-light and fixed-dark show the repaired palette selection.\n"
              "defect-dark demonstrates the old fixed backgrounds with synthetic dark palette.\n"
              "Images show widget paint/layout only; no physical display, "
              "font-smoothing or 100/125/150 percent DPI acceptance.\n",
              encoding="utf-8",
          )
          print("Captured Windows QPA before/after blank UI:", sorted(x.name for x in output.iterdir()))
          '@ | uv run --locked python -
      - name: Upload synthetic before/after UI diagnostic images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-qt-ui-before-after
          path: ${{ runner.temp }}/bank2odoo-visual/
          retention-days: 14
          if-no-files-found: error
      - name: Capture synthetic full-product dark theme pilot (before/after)
        env:
          QT_QPA_PLATFORM: windows
          PYTHONFAULTHANDLER: "1"
        shell: pwsh
        run: |
          git fetch --no-tags --depth=1 origin 1ff8057945abacf1ae8a2532ac37b9fe9dd43361
          uv run --locked python -m tests.qt_theme_pilot_capture --output "$env:RUNNER_TEMP/bank2odoo-dark-pilot"
          if ($LASTEXITCODE -ne 0) { throw "Dark pilot capture failed" }
      - name: Upload synthetic dark theme pilot images and environment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-qt-dark-theme-pilot
          path: ${{ runner.temp }}/bank2odoo-dark-pilot/
          retention-days: 14
          if-no-files-found: error
      - name: Diagnose fictional saved-path overflow on native Windows QPA
        env:
          QT_QPA_PLATFORM: windows
          PYTHONFAULTHANDLER: "1"
        shell: pwsh
        run: |
          uv run --locked python -m tests.qt_saved_paths_overflow_probe --output "$env:RUNNER_TEMP/bank2odoo-overflow-qualification"
          if ($LASTEXITCODE -ne 0) { throw "Saved paths probe failed" }
      - name: Upload diagnostic measurements and original-resolution PNGs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qt-saved-path-overflow-qualification
          path: ${{ runner.temp }}/bank2odoo-overflow-qualification/
          retention-days: 14
          if-no-files-found: warn
      - name: Offline Qt window creation smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --offline --locked python -c "from PySide6.QtWidgets import QApplication; from bank2odoo.ui.window import MainWindow; app=QApplication([]); w=MainWindow(); assert 'Bank2Odoo' in w.windowTitle(); w.close(); print('offline Qt window OK')"

  publish-curated-overflow-evidence:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'diagnostic/qt-saved-path-overflow-20261031'
    needs: verify-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out isolated non-release evidence branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: evidence/qt-saved-path-overflow-pr11-20261031
      - name: Download original synthetic Qt PNGs from successful verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qt-evidence"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name qt-saved-path-overflow-qualification --dir "$RUNNER_TEMP/qt-evidence"
          test -s "$RUNNER_TEMP/qt-evidence/measurements.json"
      - name: Curate native PNGs and machine-readable environment
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/qt-evidence"
          dest="evidence/qt-overflow-pr11"
          mkdir -p "$dest"
          cp "$source/measurements.json" "$dest/"
          cp "$source/contact_light.png" "$source/contact_dark.png" "$dest/"
          for theme in light dark; do
            for geometry in 940x830 650x520 600x480; do
              for state in production_after legacy_long_injected_after; do
                cp "$source/$theme"_"$geometry"_"$state.png" "$dest/"
              done
            done
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=Path("evidence/qt-overflow-pr11")
          data=json.loads((d/"measurements.json").read_text(encoding="utf-8"))
          (d/"environment.json").write_text(json.dumps(data["environment"],ensure_ascii=False,indent=2),encoding="utf-8")
          cases={x["case"]:x for x in data["cases"]}
          rows=[
              "# Qt saved-path overflow: synthetic Windows QPA measurements",
              "",
              "Review-only diagnostic and correction of Draft PR #10; no real bank files.",
              "Original-size Qt QWidget PNGs included. Contact sheets are resized overview.",
              "Exact verified checkout: "+data["environment"]["checkout_head"],
              "Qt QPA windows, simulated Light/Dark. NOT a physical Windows 11 acceptance.",
              "",
              "| Scheme | Requested | Actual | Viewport | H-scroll fixed | H-scroll injected old label |",
              "|---|---|---|---|---:|---:|"]
          for theme in ("light","dark"):
              for size in ("940x830","650x520","600x480"):
                  base=theme+"_"+size+"_"
                  good=cases[base+"production_after"]
                  bad=cases[base+"legacy_long_injected_after"]
                  rows.append(f"| {theme} | {size} | {good['window']} | {good['viewport']} | {good['hscroll']['maximum']} | {bad['hscroll']['maximum']} |")
          rows+=["", "Root cause 1: unbounded full mixed-script path displayed by wrapped QLabel inflates minimum column width.",
                 "Root cause 2: overly long saved-button caption independently inflates wide results column.",
                 "Remedy: short saved status, full paths in separate bounded read-only selectable LTR QLineEdits, short saved action.",
                 "Expected-red automated regression: run 41184158401; fixed result: current PR #11 checks.",
                 "NOT PROVEN: accountant Windows 11, physical DPI at 100/125/150%, AT/user acceptance.",""]
          (d/"summary.md").write_text("\n".join(rows),encoding="utf-8")
          PY
          (cd "$dest" && sha256sum *.png *.json summary.md > SHA256SUMS.txt)
      - name: Commit synthetic evidence outside main and PR #10
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/qt-overflow-pr11
          git diff --cached --check
          git commit -m "Publish synthetic Qt PR11 overflow comparison and full-size PNGs"
          git push origin HEAD:refs/heads/evidence/qt-saved-path-overflow-pr11-20261031
