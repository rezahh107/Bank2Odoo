name: Bank2Odoo headless + Persian Qt verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    steps:
      - name: Check out exact PR Head or push commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        shell: pwsh
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_HEAD) {
            throw "CI checkout mismatch: expected $env:EXPECTED_HEAD, got $actual"
          }
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.10.0"
      - name: Install Python
        run: uv python install 3.13
      - name: Temporary lock generation (remove after lockfile committed)
        shell: pwsh
        run: |
          uv lock
          if ($LASTEXITCODE -ne 0) { throw "uv lock failed" }
          Write-Host ("LOCKBASE64:" + [Convert]::ToBase64String([IO.File]::ReadAllBytes("uv.lock")))
      - name: Sync exact locked environment
        run: uv sync --locked
      - name: Run automated verification
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Smoke-run preserved headless entrypoint
        run: uv run --locked python -m bank2odoo
      - name: Check GUI module import
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --locked python -c "from bank2odoo.ui.window import MainWindow; print('Qt module import OK')"
